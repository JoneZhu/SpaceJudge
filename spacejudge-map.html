  function select(id,expand=true){state.selected=id;if(expand&&nodes.get(id).children)state.expanded[id]=Math.min(3,(state.expanded[id]||0)+1);hideTooltip();map();save()}
  function open(title,body){hideTooltip();$('#s-context').hidden=true;$('#s-dialog-title').textContent=title;$('#s-dialog-body').innerHTML=body;if(!$('#s-dialog').open)$('#s-dialog').showModal();icons()}
  function info(){const n=nodes.get(state.selected);open(n.name,`<dl><dt>完整路径</dt><dd>${escape(n.path)}</dd><dt>占用大小</dt><dd>${format(n.size)}</dd><dt>类型</dt><dd>${n.children?'目录':'文件'} · 示例数据</dd><dt>包含内容</dt><dd>${count(visible(n))} 个示例文件</dd></dl><p style="margin-top:20px;font-size:11px;color:#99a59d">这里仅展示模拟信息；没有读取本机文件。</p>`)}
  function hideTooltip(){clearTimeout(hoverTimer);$('#s-tooltip').hidden=true}
  function tooltip(id,x,y){const n=nodes.get(id),t=$('#s-tooltip'),bounds=root.getBoundingClientRect();t.innerHTML=`${escape(n.name)} · ${format(n.size)}<small>${escape(n.path)}</small>`;t.hidden=false;const width=t.offsetWidth,height=t.offsetHeight;t.style.left=Math.max(8,Math.min(x-bounds.left+12,bounds.width-width-8))+'px';t.style.top=Math.max(8,Math.min(y-bounds.top+16,bounds.height-height-8))+'px'}
  const actions={info,close:()=>$('#s-dialog').close(),back:()=>{if(state.historyIndex>0)go(state.history[--state.historyIndex],false)},up:()=>{const p=nodes.get(state.focus).parent;if(p)go(p.id)},enter:()=>go(state.selected),finder:()=>{const n=nodes.get(state.selected);open('在 Finder 中显示 · 演示',`<p>原生版本会在 Finder 中选中这个项目。</p><p><code>${escape(n.path)}</code></p><p style="font-size:11px;color:#99a59d">浏览器原型仅展示目标位置，不会打开真实文件。</p>`)}};
  root.addEventListener('click',e=>{const hit=e.target.closest('[data-select]');if(hit){clearTimeout(clickTimer);if(e.detail===0)select(hit.dataset.select);else clickTimer=setTimeout(()=>select(hit.dataset.select),230);return}hideTooltip();const act=e.target.closest('[data-action]');if(act){actions[act.dataset.action]?.();$('#s-context').hidden=true;return}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const detail=e.target.closest('[data-detail]');if(detail){state.detail=Number(detail.dataset.detail);state.expanded={};render();save();return}$('#s-context').hidden=true});
  root.addEventListener('dblclick',e=>{const hit=e.target.closest('[data-select]');if(!hit)return;clearTimeout(clickTimer);const n=nodes.get(hit.dataset.select);if(n.children)go(n.id);else{select(n.id,false);info()}});
  root.addEventListener('contextmenu',e=>{const hit=e.target.closest('[data-select]');if(!hit)return;e.preventDefault();clearTimeout(clickTimer);select(hit.dataset.select,false);const n=nodes.get(state.selected),menu=$('#s-context'),box=root.getBoundingClientRect();menu.innerHTML=`${n.children?'<button class="cursor-interaction" data-action="enter">进入目录</button>':''}<button class="cursor-interaction" data-action="info">查看信息</button><button class="cursor-interaction" data-action="finder">在 Finder 中显示 · 演示</button>`;menu.style.left=Math.max(8,Math.min(e.clientX-box.left,box.width-208))+'px';menu.style.top=Math.max(8,Math.min(e.clientY-box.top,box.height-150))+'px';menu.hidden=false});
  root.addEventListener('pointerover',e=>{const hit=e.target.closest('[data-select]');if(hit&&!hit.contains(e.relatedTarget)){hideTooltip();hoverTimer=setTimeout(()=>tooltip(hit.dataset.select,e.clientX,e.clientY),500)}});
  root.addEventListener('pointerout',e=>{const hit=e.target.closest('[data-select]');if(hit&&!hit.contains(e.relatedTarget))hideTooltip()});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#s-context').hidden=true;hideTooltip()}if((e.metaKey||e.ctrlKey)&&e.key==='ArrowUp'){e.preventDefault();actions.up()}});
  $('#s-dialog').addEventListener('click',e=>{if(e.target===$('#s-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
  new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(map)}).observe($('#s-map'));
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render()}});
  if(globalThis.Tweak){const t=new globalThis.Tweak({container:root,onChange:()=>{root.style.setProperty('--s-radius',design.radius+'px');map()}});t.addSelect(design,'palette',{label:'空间图配色',options:['目录配色','统一浅灰']});t.addSlider(design,'radius',{label:'方块圆角',min:2,max:12,unit:'px'})}
})();
</script>
</div>
