  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

    };

      }),

  };

    postToHost(&quot;height&quot;, {

          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);

                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }

    if (event.target instanceof globalThis.Element) {

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

    function renderInspector(){const n=nodes.get(state.selected)||data,c=copyFor(n),size=fullSize(n),tag=state.tags[n.id];const matched=filtered(n)?.value||0;const focusSize=filtered(nodes.get(state.focus))?.value||0;const share=focusSize?matched/focusSize*100:0;$(&#x27;#sj-inspector-content&#x27;).innerHTML=`&lt;div class=&quot;sj-objecticon&quot;&gt;&lt;i data-lucide=&quot;${n.children?&#x27;folder&#x27;:&#x27;file&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;h2 class=&quot;sj-object-name&quot;&gt;${esc(n.name)}&lt;/h2&gt;&lt;p class=&quot;sj-object-path&quot;&gt;${esc(n.path)}&lt;/p&gt;&lt;dl class=&quot;sj-meta&quot;&gt;&lt;div&gt;&lt;dt&gt;${state.filter?&#x27;匹配文件占用&#x27;:&#x27;目录内占用&#x27;}&lt;/dt&gt;&lt;dd&gt;${fmt(state.filter?matched:size)} GB&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;${state.filter?&#x27;筛选内占比&#x27;:&#x27;占当前视图&#x27;}&lt;/dt&gt;&lt;dd&gt;${share&gt;100?&#x27;—&#x27;:share.toFixed(1)+&#x27;%&#x27;}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;${n.children?&#x27;包含内容&#x27;:&#x27;文件类型&#x27;}&lt;/dt&gt;&lt;dd&gt;${n.children?leafCount(n)+&#x27; 个示例文件&#x27;:esc(n.name.includes(&#x27;.&#x27;)?n.name.split(&#x27;.&#x27;).pop().toUpperCase():&#x27;模拟数据文件&#x27;)}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;${n.children?&#x27;扫描状态&#x27;:&#x27;修改于&#x27;}&lt;/dt&gt;&lt;dd&gt;${n.children?(scanned(n)?&#x27;已发现 · 示例&#x27;:&#x27;等待扫描&#x27;):(n.months?n.months+&#x27; 个月前&#x27;:&#x27;本月&#x27;)}&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;section class=&quot;sj-ai&quot;&gt;&lt;div class=&quot;sj-ai-heading&quot;&gt;&lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;AI 空间判断&lt;small&gt;预设内容&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;sj-answer&quot;&gt;&lt;p&gt;&lt;strong&gt;${c.title}&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;${c.body}&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;sj-evidence&quot;&gt;&lt;summary&gt;查看判断依据与边界&lt;/summary&gt;&lt;ul&gt;${c.evidence.map(t=&gt;&#x27;&lt;li&gt;&#x27;+t+&#x27;&lt;/li&gt;&#x27;).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;sj-question-row&quot;&gt;&lt;button data-action=&quot;ask-impact&quot;&gt;处理后会怎样？&lt;/button&gt;&lt;button data-action=&quot;ask-recover&quot;&gt;能恢复吗？&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;sj-followup&quot; id=&quot;sj-followup&quot; ${state.followup?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;${esc(state.followup)}&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;sj-tags&quot;&gt;&lt;span&gt;检查标记&lt;/span&gt;${Object.entries(tagColors).map(([key,color])=&gt;`&lt;button class=&quot;sj-tag-button${tag===key?&#x27; active&#x27;:&#x27;&#x27;}&quot; data-tag=&quot;${key}&quot; style=&quot;--tag:${color}&quot; aria-label=&quot;标记为${tagNames[key]}&quot; aria-pressed=&quot;${tag===key}&quot;&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button class=&quot;sj-textbutton&quot; data-action=&quot;clear-tag&quot; style=&quot;color:#8d9991;margin-left:auto&quot;&gt;清除&lt;/button&gt;&lt;/div&gt;`;

    function render(){const focus=nodes.get(state.focus)||data,v=filtered(focus);$(&#x27;#sj-view-name&#x27;).textContent=focus.name;$(&#x27;#sj-view-subtitle&#x27;).textContent=focus.path;$(&#x27;#sj-view-size&#x27;).textContent=fmt(v?v.value:0);$(&#x27;#sj-view-count&#x27;).textContent=state.filter?&#x27;筛选匹配占用 · 示例&#x27;:state.progress&lt;100?&#x27;已发现占用 · 模拟扫描&#x27;:&#x27;目录内占用 · 示例&#x27;;$(&#x27;#sj-detail-level&#x27;).textContent=state.detail;$(&#x27;[data-action=&quot;less-detail&quot;]&#x27;).disabled=state.detail&lt;=1;$(&#x27;[data-action=&quot;more-detail&quot;]&#x27;).disabled=state.detail&gt;=4;$(&#x27;[data-action=&quot;back&quot;]&#x27;).disabled=state.historyIndex===0;$(&#x27;[data-action=&quot;forward&quot;]&#x27;).disabled=state.historyIndex&gt;=state.history.length-1;$(&#x27;[data-action=&quot;up&quot;]&#x27;).disabled=state.focus===&#x27;home&#x27;;let path=[];for(let n=focus;n;n=n.parent)path.unshift(n);$(&#x27;#sj-crumbs&#x27;).innerHTML=path.map((n,i)=&gt;(i?&#x27;&lt;span&gt;›&lt;/span&gt;&#x27;:&#x27;&#x27;)+`&lt;button data-location=&quot;${n.id}&quot;&gt;${esc(n.name)}&lt;/button&gt;`).join(&#x27;&#x27;);$$(&#x27;.sj-location[data-location]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;active&#x27;,b.dataset.location===state.focus));$$(&#x27;.sj-chip&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;active&#x27;,b.dataset.filter===state.filter));$(&#x27;#sj-queue-count&#x27;).textContent=state.queue.size;$(&#x27;#sj-queue-count&#x27;).hidden=!state.queue.size;$(&#x27;#sj-file-count&#x27;).textContent=&#x27;· &#x27;+(v?countView(v):0)+&#x27; 个示例文件&#x27;;$(&#x27;#sj-map-caption&#x27;).textContent=state.filter?&#x27;已按匹配文件重新布局 · &#x27;+state.filter:&#x27;面积代表占用大小 · 颜色区分目录&#x27;;$(&#x27;#sj-trash-status&#x27;).textContent=state.removed.size?&#x27;模拟废纸篓 &#x27;+fmt(removedSize())+&#x27; GB · 可用空间未增加&#x27;:&#x27;本地演示 · 未读取你的磁盘&#x27;;renderScan();renderInspector();drawMap();icons()}

    function showQueue(){const items=[...state.queue].map(id=&gt;nodes.get(id)),size=items.reduce((s,n)=&gt;s+fullSize(n),0);modal(&#x27;清理清单&#x27;,items.length?`&lt;div class=&quot;sj-intro-box&quot;&gt;先确认用途，再处理。清单只包含你主动加入的项目，不会自动勾选其他文件。&lt;/div&gt;${items.map(n=&gt;`&lt;div class=&quot;sj-suggestion&quot;&gt;&lt;div class=&quot;sj-suggestion-main&quot;&gt;&lt;strong&gt;${esc(n.name)}&lt;/strong&gt;&lt;p&gt;${esc(n.path)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;sj-suggestion-size&quot;&gt;${fmt(fullSize(n))} GB&lt;/span&gt;&lt;button class=&quot;sj-icon-button&quot; data-remove-queue=&quot;${n.id}&quot; aria-label=&quot;从清单移除 ${esc(n.name)}&quot;&gt;×&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p style=&quot;margin-top:18px;font-size:11px&quot;&gt;模拟移入废纸篓后，文件会从原目录图中移除，但仍然占用磁盘。只有最终删除后才可能释放空间；真实收益仍需重新测量。&lt;/p&gt;`:&#x27;&lt;div class=&quot;sj-queue-empty&quot;&gt;&lt;h3&gt;清单还是空的&lt;/h3&gt;&lt;p&gt;选中一个可处理的示例目录，查看依据后加入清单。&lt;/p&gt;&lt;button class=&quot;sj-button&quot; data-action=&quot;suggestions&quot; style=&quot;margin-top:15px&quot;&gt;查看建议&lt;/button&gt;&lt;/div&gt;&#x27;,`&lt;span&gt;${items.length} 项 · 目录占用合计 &lt;b&gt;${fmt(size)} GB&lt;/b&gt;&lt;/span&gt;&lt;div class=&quot;sj-flex&quot;&gt;${state.undo.length?&#x27;&lt;button class=&quot;sj-button&quot; data-action=&quot;undo&quot;&gt;撤销上次模拟&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;button class=&quot;sj-button sj-primary&quot; data-action=&quot;simulate-trash&quot; ${items.length?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;模拟移入废纸篓&lt;/button&gt;&lt;/div&gt;`)}
    function simulateTrash(){const ids=[...state.queue];if(!ids.length)return;state.undo.push({ids,removed:[...state.removed],selected:state.selected,focus:state.focus});ids.forEach(id=&gt;{for(const old of state.removed){if(isAncestor(nodes.get(id),nodes.get(old)))state.removed.delete(old)}state.removed.add(id)});state.queue.clear();if(isRemoved(nodes.get(state.focus)))state.focus=&#x27;home&#x27;;state.selected=state.focus;render();persist();showQueue();toast(&#x27;已模拟移入废纸篓；磁盘可用空间没有增加。&#x27;,true)}

    function showSuggestions(){modal(&#x27;值得先检查的空间&#x27;,`&lt;div class=&quot;sj-intro-box&quot;&gt;按“用途容易确认、处理收益明显”组织的预设示例。它们是候选项，需要查看影响；这里没有真实 AI 调用。&lt;/div&gt;${suggestions.filter(id=&gt;!isRemoved(nodes.get(id))).map(id=&gt;{const n=nodes.get(id);return `&lt;div class=&quot;sj-suggestion&quot;&gt;&lt;div class=&quot;sj-objecticon&quot; style=&quot;width:34px;height:34px;margin:0&quot;&gt;&lt;i data-lucide=&quot;${id===&#x27;installers&#x27;?&#x27;package&#x27;:&#x27;folder&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;sj-suggestion-main&quot;&gt;&lt;strong&gt;${esc(n.name)}&lt;/strong&gt;&lt;p&gt;${copyFor(n).title}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;sj-suggestion-size&quot;&gt;${fmt(fullSize(n))} GB&lt;/span&gt;&lt;button class=&quot;sj-button&quot; data-inspect=&quot;${id}&quot;&gt;查看依据&lt;/button&gt;&lt;/div&gt;`}).join(&#x27;&#x27;)}&lt;h3&gt;默认保留的内容&lt;/h3&gt;&lt;p&gt;聊天记录、照片原件、源代码和发布归档，仅凭占用大小不能判断清理价值。&lt;/p&gt;`)}
    function guide(){modal(&#x27;原型说明 · 从看见空间到做出判断&#x27;,`&lt;div class=&quot;sj-intro-box&quot;&gt;&lt;strong&gt;这是什么？&lt;/strong&gt;&lt;br&gt;SpaceJudge 的 macOS 浅色设计原型：以 SpaceSniffer 的嵌套空间图和直接操作为基础，用微信桌面端式的侧栏、细分隔线、浅灰底与绿色强调重新组织界面。&lt;/div&gt;&lt;h3&gt;先用 30 秒走一遍&lt;/h3&gt;&lt;p&gt;点击「跟着体验」，或者单击资源库 → 双击 Developer → 选中 DerivedData → 看右侧判断依据 → 加入清理清单。清单里可以模拟处理，并撤销。&lt;/p&gt;&lt;h3&gt;研究后保留的交互&lt;/h3&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;SpaceSniffer 的方式&lt;/th&gt;&lt;th&gt;本原型的对应操作&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;单击展开细节；双击放大目录&lt;/td&gt;&lt;td&gt;单击方块原位展开；双击目录进入，面包屑与前后退保留路径。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;调整展示细节&lt;/td&gt;&lt;td&gt;「细节 − / +」控制 1–4 层；过小区域按空间限制聚合。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;表达式筛选与重排&lt;/td&gt;&lt;td&gt;类型、大小、修改年龄、排除条件与标记；按 Enter 应用。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;四种临时颜色标记&lt;/td&gt;&lt;td&gt;右侧四色标记；这版赋予“保留 / 确认 / 处理 / 已检查”含义，可清除。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;扫描中浏览、右键操作&lt;/td&gt;&lt;td&gt;点击「演示重新扫描」体验渐进结果、暂停、继续和停止；右键显示原型菜单。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;h3&gt;我们新增的设计&lt;/h3&gt;&lt;p&gt;右侧「文件洞察」随选中项更新，解释用途、证据和处理影响；你确认后再加入清理清单。空间地图的底色表示目录类别，右下的小圆点才是检查标记。旧文件不自动等于无用文件。&lt;/p&gt;&lt;h3&gt;筛选规则 · 本原型支持的子集&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;code&gt;*.dmg&lt;/code&gt;：安装包；&lt;code&gt;&gt;10gb&lt;/code&gt;：单个文件大于 10 GB。&lt;/li&gt;&lt;li&gt;&lt;code&gt;&gt;6months&lt;/code&gt;：文件修改时间早于 6 个月前，不代表半年没用过。&lt;/li&gt;&lt;li&gt;&lt;code&gt;*.dmg;&gt;5gb&lt;/code&gt;：两个条件同时满足；&lt;code&gt;|*.dmg&lt;/code&gt;：排除安装包。&lt;/li&gt;&lt;li&gt;&lt;code&gt;:green&lt;/code&gt;：处理标记；&lt;code&gt;:all&lt;/code&gt;：所有已标记项目。目录标记在本原型中作用于子项。&lt;/li&gt;&lt;li&gt;筛选后矩形按匹配文件占用重新分配；默认 GB 使用十进制。&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;键盘操作&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;sj-shortcut&quot;&gt;⌘ F&lt;/span&gt; 筛选　&lt;span class=&quot;sj-shortcut&quot;&gt;⌘ ↑&lt;/span&gt; 上一级　&lt;span class=&quot;sj-shortcut&quot;&gt;⌘ 1–4&lt;/span&gt; 给选中项加四色标记。方块支持 Tab 聚焦与 Enter 选中，进入目录也可使用右侧按钮。&lt;/p&gt;&lt;h3&gt;哪些是真交互，哪些只是演示？&lt;/h3&gt;&lt;p&gt;地图布局、展开、进入、前进后退、筛选、标记、清单、模拟移除和撤销都可操作。文件树是人工构造的 312.6 GB 用户目录，修改年龄以 2026-09-26 为演示基准；磁盘容量也是模拟值。没有读取或删除本机文件，AI 文案为预设，Finder 操作为演示，不代表原生版本性能。&lt;/p&gt;&lt;h3&gt;尚未在这版实现&lt;/h3&gt;&lt;p&gt;真实全盘扫描与权限提示、FSEvents 增量更新、多磁盘 / 多窗口共享扫描、系统右键菜单、拖拽真实目录、导出报告、真实模型调用、APFS 克隆 / 快照 / 云文件占用校正。SpaceSniffer 的 NTFS 特性不直接移植到 Mac。&lt;/p&gt;&lt;h3&gt;资料来源与研究边界&lt;/h3&gt;&lt;p&gt;依据 &lt;a href=&quot;https://www.uderzo.it/main_products/space_sniffer/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;SpaceSniffer 官方操作介绍&lt;/a&gt;、&lt;a href=&quot;https://www.uderzo.it/main_products/space_sniffer/features.html&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;官方功能说明&lt;/a&gt;和&lt;a href=&quot;https://apps.apple.com/cn/app/%E5%BE%AE%E4%BF%A1/id836500024?mt=12&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;腾讯微信 Mac 产品页&lt;/a&gt;。本轮为文档研究，未运行 Windows 版 SpaceSniffer；本设计重新绘制界面，不使用其源码或品牌素材。&lt;/p&gt;`,`&lt;span&gt;V0.1 · 产品交互讨论稿，非性能验证版本&lt;/span&gt;&lt;button class=&quot;sj-button sj-primary&quot; data-action=&quot;tour&quot;&gt;跟着体验&lt;/button&gt;`)}
    function showLocation(){modal(&#x27;选择演示扫描位置&#x27;,&#x27;&lt;div class=&quot;sj-intro-box&quot;&gt;浏览器原型使用固定样例。这里的选择不会请求磁盘访问权限；真实选择器留到 macOS 原生版本。&lt;/div&gt;&#x27;+[&#x27;home&#x27;,&#x27;downloads&#x27;,&#x27;movies&#x27;,&#x27;projects&#x27;,&#x27;library&#x27;].map(id=&gt;{const n=nodes.get(id);return `&lt;div class=&quot;sj-suggestion&quot;&gt;&lt;div class=&quot;sj-suggestion-main&quot;&gt;&lt;strong&gt;${n.name}&lt;/strong&gt;&lt;p&gt;${esc(n.path)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;sj-suggestion-size&quot;&gt;${fmt(fullSize(n))} GB&lt;/span&gt;&lt;button class=&quot;sj-button&quot; data-pick-location=&quot;${id}&quot;&gt;浏览示例&lt;/button&gt;&lt;/div&gt;`}).join(&#x27;&#x27;))}
    const tours=[{text:&#x27;&lt;b&gt;01 看见占用。&lt;/b&gt; 方块越大，占用越大。单击「资源库」，在原位看到更多内容。&#x27;,run:()=&gt;{setFilter(&#x27;&#x27;);navigate(&#x27;home&#x27;);select(&#x27;library&#x27;,false)}},{text:&#x27;&lt;b&gt;02 进入目录。&lt;/b&gt; 已进入 Developer；选中 DerivedData，右侧会解释用途与处理影响。&#x27;,run:()=&gt;{navigate(&#x27;developer&#x27;);select(&#x27;derived&#x27;,false)}},{text:&#x27;&lt;b&gt;03 先看依据。&lt;/b&gt; 展开判断依据，或问“处理后会怎样？”。确认后加入清单，不会立刻删除。&#x27;,run:()=&gt;{select(&#x27;derived&#x27;,false);$(&#x27;.sj-evidence&#x27;).open=true}},{text:&#x27;&lt;b&gt;04 预览处理。&lt;/b&gt; 打开左侧清单，可以模拟移入废纸篓并撤销；可用空间不会因此增加。&#x27;,run:()=&gt;{addQueue(&#x27;derived&#x27;);showQueue()}}];
    function tourStep(step){if(step&gt;=tours.length){state.tour=-1;$(&#x27;#sj-tour&#x27;).hidden=true;return}closeModal();state.tour=step;$(&#x27;#sj-tour&#x27;).hidden=false;$(&#x27;#sj-tour-number&#x27;).textContent=(step+1)+&#x27; / 4&#x27;;$(&#x27;#sj-tour-text&#x27;).innerHTML=tours[step].text;$(&#x27;[data-action=&quot;tour-next&quot;]&#x27;).textContent=step===3?&#x27;结束引导&#x27;:&#x27;下一步&#x27;;tours[step].run()}
    function setTag(key){state.tags[state.selected]=key;render();persist();toast(&#x27;已标记为「&#x27;+tagNames[key]+&#x27;」。标记不代表 AI 验证结果。&#x27;)}
    const actions={&#x27;apply-filter&#x27;:()=&gt;setFilter($(&#x27;#sj-filter&#x27;).value.trim()),guide,tour:()=&gt;tourStep(0),&#x27;tour-next&#x27;:()=&gt;tourStep(state.tour+1),&#x27;tour-close&#x27;:()=&gt;{state.tour=-1;$(&#x27;#sj-tour&#x27;).hidden=true},map:()=&gt;{closeModal();navigate(&#x27;home&#x27;)},suggestions:showSuggestions,queue:showQueue,location:showLocation,&#x27;close-dialog&#x27;:closeModal,&#x27;clear-filter&#x27;:()=&gt;setFilter(&#x27;&#x27;),back:()=&gt;{if(state.historyIndex&gt;0)navigate(state.history[--state.historyIndex],false)},forward:()=&gt;{if(state.historyIndex&lt;state.history.length-1)navigate(state.history[++state.historyIndex],false)},up:()=&gt;{const n=nodes.get(state.focus);if(n.parent)navigate(n.parent.id)},&#x27;more-detail&#x27;:()=&gt;{state.detail=Math.min(4,state.detail+1);render();persist()},&#x27;less-detail&#x27;:()=&gt;{state.detail=Math.max(1,state.detail-1);state.expanded.clear();render();persist()},&#x27;enter-selected&#x27;:()=&gt;navigate(state.selected),&#x27;add-queue&#x27;:()=&gt;addQueue(),&#x27;clear-tag&#x27;:()=&gt;{delete state.tags[state.selected];render();persist()},&#x27;mark-keep&#x27;:()=&gt;setTag(&#x27;red&#x27;),&#x27;ask-impact&#x27;:()=&gt;{state.followup=copyFor(nodes.get(state.selected)).impact;renderInspector()},&#x27;ask-recover&#x27;:()=&gt;{state.followup=&#x27;原型里的模拟操作可撤销。真实移入废纸篓的文件通常可在清空前放回；清空后不能承诺恢复。缓存“重新生成”也不等于还原原文件。&#x27;;renderInspector()},finder:()=&gt;modal(&#x27;Finder 定位 · 演示&#x27;,`&lt;div class=&quot;sj-intro-box&quot;&gt;原生版会在 Finder 中选中该项目。浏览器原型仅展示目标路径，不会打开你的真实文件。&lt;/div&gt;&lt;p&gt;&lt;code&gt;${esc(nodes.get(state.selected).path)}&lt;/code&gt;&lt;/p&gt;`),preview:()=&gt;modal(&#x27;文件预览 · 演示&#x27;,`&lt;div class=&quot;sj-intro-box&quot;&gt;${esc(nodes.get(state.selected).name)}&lt;/div&gt;&lt;p&gt;大小：${fmt(fullSize(nodes.get(state.selected)))} GB&lt;/p&gt;&lt;p&gt;本原型没有真实文件内容。原生版计划使用系统 Quick Look 进行预览。&lt;/p&gt;`),rescan:startScan,&#x27;pause-scan&#x27;:()=&gt;{state.paused=!state.paused;renderScan()},&#x27;stop-scan&#x27;:()=&gt;{clearInterval(scanTimer);state.scanning=false;render()},&#x27;simulate-trash&#x27;:simulateTrash,undo};
    root.addEventListener(&#x27;click&#x27;,e=&gt;{const hit=e.target.closest(&#x27;[data-node-action]&#x27;);if(hit){if(e.detail===0){select(hit.dataset.nodeAction);return}clearTimeout(clickTimer);clickTimer=setTimeout(()=&gt;select(hit.dataset.nodeAction),230);return}const act=e.target.closest(&#x27;[data-action]&#x27;);if(act){const fn=actions[act.dataset.action];if(fn)fn();$(&#x27;#sj-context&#x27;).hidden=true;return}const loc=e.target.closest(&#x27;[data-location]&#x27;);if(loc){navigate(loc.dataset.location);return}const filter=e.target.closest(&#x27;[data-filter]&#x27;);if(filter){setFilter(filter.dataset.filter);return}const tag=e.target.closest(&#x27;[data-tag]&#x27;);if(tag){setTag(tag.dataset.tag);return}const inspect=e.target.closest(&#x27;[data-inspect]&#x27;);if(inspect){const n=nodes.get(inspect.dataset.inspect);closeModal();setFilter(&#x27;&#x27;);navigate(n.parent.id);select(n.id,false);$(&#x27;.sj-evidence&#x27;).open=true;return}const pick=e.target.closest(&#x27;[data-pick-location]&#x27;);if(pick){closeModal();setFilter(&#x27;&#x27;);navigate(pick.dataset.pickLocation);return}const rm=e.target.closest(&#x27;[data-remove-queue]&#x27;);if(rm){state.queue.delete(rm.dataset.removeQueue);render();persist();showQueue();return}$(&#x27;#sj-context&#x27;).hidden=true});
    root.addEventListener(&#x27;dblclick&#x27;,e=&gt;{const hit=e.target.closest(&#x27;[data-node-action]&#x27;);if(!hit)return;clearTimeout(clickTimer);const n=nodes.get(hit.dataset.nodeAction);if(n.children)navigate(n.id);else{select(n.id,false);actions.preview()}});
    root.addEventListener(&#x27;pointerover&#x27;,e=&gt;{const hit=e.target.closest(&#x27;[data-node-action]&#x27;);if(hit){const n=nodes.get(hit.dataset.nodeAction);$(&#x27;#sj-hoverpath&#x27;).textContent=n.path+&#x27; · &#x27;+fmt(fullSize(n))+&#x27; GB&#x27;}});
    root.addEventListener(&#x27;contextmenu&#x27;,e=&gt;{const hit=e.target.closest(&#x27;[data-node-action]&#x27;);if(!hit)return;e.preventDefault();clearTimeout(clickTimer);select(hit.dataset.nodeAction,false);const n=nodes.get(state.selected),menu=$(&#x27;#sj-context&#x27;);menu.innerHTML=`${n.children?&#x27;&lt;button data-action=&quot;enter-selected&quot;&gt;进入目录&lt;/button&gt;&#x27;:&#x27;&lt;button data-action=&quot;preview&quot;&gt;预览 · 模拟&lt;/button&gt;&#x27;}&lt;button data-action=&quot;finder&quot;&gt;在 Finder 中显示 · 模拟&lt;/button&gt;&lt;button data-action=&quot;mark-keep&quot;&gt;标记为保留&lt;/button&gt;${copyFor(n).safe?&#x27;&lt;button data-action=&quot;add-queue&quot;&gt;加入清理清单&lt;/button&gt;&#x27;:&#x27;&#x27;}`;const box=root.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(e.clientX-box.left,box.width-200))+&#x27;px&#x27;;menu.style.top=Math.max(8,Math.min(e.clientY-box.top,box.height-185))+&#x27;px&#x27;;menu.hidden=false});
    $(&#x27;#sj-filter&#x27;).addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;){e.preventDefault();setFilter($(&#x27;#sj-filter&#x27;).value.trim())}});
    root.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Escape&#x27;){$(&#x27;#sj-context&#x27;).hidden=true;return}if((e.metaKey||e.ctrlKey)&amp;&amp;e.key===&#x27;f&#x27;){e.preventDefault();$(&#x27;#sj-filter&#x27;).focus();return}if(e.target.matches(&#x27;input,textarea&#x27;))return;if((e.metaKey||e.ctrlKey)&amp;&amp;e.key===&#x27;ArrowUp&#x27;){e.preventDefault();actions.up()}if((e.metaKey||e.ctrlKey)&amp;&amp;[&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;4&#x27;].includes(e.key)){e.preventDefault();setTag([&#x27;red&#x27;,&#x27;yellow&#x27;,&#x27;green&#x27;,&#x27;blue&#x27;][Number(e.key)-1])}});
    $(&#x27;#sj-dialog&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{if(e.target===$(&#x27;#sj-dialog&#x27;)){const r=e.target.getBoundingClientRect();if(e.clientX&lt;r.left||e.clientX&gt;r.right||e.clientY&lt;r.top||e.clientY&gt;r.bottom)closeModal()}});
    new ResizeObserver(()=&gt;{cancelAnimationFrame(mapRAF);mapRAF=requestAnimationFrame(drawMap)}).observe($(&#x27;#sj-treemap&#x27;));
    restore(window.openai?.widgetState);render();
    window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{const saved=e.detail?.globals?.widgetState;if(saved){restore(saved);render()}});
    if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=&gt;{root.style.setProperty(&#x27;--sj-radius&#x27;,visual.radius+&#x27;px&#x27;);drawMap()}});tweak.addSelect(visual,&#x27;palette&#x27;,{label:&#x27;空间图配色&#x27;,options:[&#x27;柔和分区&#x27;,&#x27;统一浅灰&#x27;]});tweak.addSlider(visual,&#x27;radius&#x27;,{label:&#x27;方块圆角&#x27;,min:2,max:12,unit:&#x27;px&#x27;})}
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
