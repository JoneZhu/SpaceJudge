  function index(n,parent=null,category=null){n.parent=parent;n.category=n.category||category;n.path=n===disk?'/':n===data?'/Users/lin':n.virtual?'磁盘占用汇总 · 非实际目录':parent.path.replace(/\/$/,'')+'/'+(n.pathName||n.name);if(n.children){n.children.forEach(c=>index(c,n,n.category));n.size=n.children.reduce((s,c)=>s+c.size,0)}else{n.order=leaves.length;leaves.push(n)}nodes.set(n.id,n)}index(disk);
  const palette={library:['#dbe9e0','#e6efe9','资源库','#a7c5b2'],movies:['#dce7ef','#e7eef4','影片','#b0c2ce'],downloads:['#eee4d4','#f5eee3','下载','#ccbea8'],projects:['#e5e1ef','#eeebf5','项目','#b8b4cf'],pictures:['#eaddd1','#f3e9e0','照片','#c7b9ab'],documents:['#e2e9da','#edf1e7','文稿','#bcc9b1'],applications:['#dfe6eb','#edf1f5','应用程序','#b1bfca'],system:['#e6e8e4','#f0f2ed','系统及其他','#bfc6ba']};
  const state={focus:'home',selected:'library',detail:3,expanded:{},history:['home'],historyIndex:0,scanning:false,paused:false,progress:100};
  const design={radius:9,palette:'目录配色'};
  let clickTimer,scanTimer,raf,hoverTimer;
  function icons(){globalThis.lucide?.createIcons({attrs:{width:17,height:17}})}
  function save(){window.openai?.setWidgetState?.({modelContent:{version:2,focus:state.focus,selected:state.selected,detail:state.detail},privateContent:{expanded:state.expanded}}).catch(()=>{})}
  function restore(saved){if(saved?.modelContent?.version!==2)return;const m=saved.modelContent,p=saved.privateContent||{};if(nodes.get(m.focus)?.children)state.focus=m.focus;if(nodes.has(m.selected))state.selected=m.selected;state.detail=m.detail===2?2:3;state.expanded=p.expanded||{};if(state.history[state.historyIndex]!==state.focus){state.history=[state.focus];state.historyIndex=0}}
  function visible(n){if(n.children){const children=n.children.map(visible).filter(Boolean),value=children.reduce((s,c)=>s+c.value,0);return value?{node:n,children,value}:null}return n.order<Math.ceil(leaves.length*state.progress/100)?{node:n,value:n.size}:null}
  function count(v){return !v?0:v.children?v.children.reduce((s,c)=>s+count(c),0):1}
    function layout(items,x,y,w,h){if(!items.length||w<=0||h<=0)return[];const total=items.reduce((s,v)=>s+v.value,0),scale=w*h/total;let pending=[...items].sort((a,b)=>b.value-a.value).map(d=>({...d,area:d.value*scale}));const rects=[];let row=[];const worst=(r,side)=>{if(!r.length)return Infinity;const sum=r.reduce((s,v)=>s+v.area,0);const areas=r.map(v=>v.area);return Math.max(side*side*Math.max(...areas)/(sum*sum),sum*sum/(side*side*Math.min(...areas)))};function place(){const area=row.reduce((s,v)=>s+v.area,0);if(w>=h){const rw=area/h;let yy=y;row.forEach(d=>{const rh=d.area/rw;rects.push({...d,x,y:yy,w:rw,h:rh});yy+=rh});x+=rw;w-=rw}else{const rh=area/w;let xx=x;row.forEach(d=>{const rw=d.area/rh;rects.push({...d,x:xx,y,w:rw,h:rh});xx+=rw});y+=rh;h-=rh}row=[]}while(pending.length){const next=pending[0],side=Math.min(w,h);if(!row.length||worst([...row,next],side)<=worst(row,side)){row.push(pending.shift())}else place()}if(row.length)place();return rects}
  function map(){const el=$('#s-map'),view=visible(nodes.get(state.focus));el.innerHTML='';if(!view){el.innerHTML='<div class="s-empty"><i data-lucide="scan-line" aria-hidden="true"></i><b>正在发现文件…</b><span>已有结果会逐步出现在这里</span></div>';icons();return}function paint(items,x,y,w,h,depth,bonus=0){layout(items,x,y,w,h).forEach(r=>{const gap=depth===1?5:3,rx=r.x+gap/2,ry=r.y+gap/2,rw=r.w-gap,rh=r.h-gap;if(rw<4||rh<4)return;const n=r.node,extra=bonus+(state.expanded[n.id]||0),branch=!!r.children&&depth<state.detail+extra&&rw>105&&rh>95;const tile=document.createElement('div');tile.className='s-tile'+(branch?' s-parent':'');tile.dataset.node=n.id;tile.style.cssText=`left:${rx}px;top:${ry}px;width:${rw}px;height:${rh}px;--fill:${design.palette==='统一浅灰'?'#e5ece6':(palette[n.category]||palette.system)[depth%2===0?1:0]}`;const button=document.createElement('button');button.className='s-tile-hit cursor-interaction';button.dataset.select=n.id;button.setAttribute('aria-label',n.name+'，'+format(r.value)+(n.children?'，目录':'，文件'));button.setAttribute('aria-pressed',String(state.selected===n.id));if(rw>46&&rh>37)button.innerHTML=`<span class="s-tile-name">${n.children?'<span class="s-folder-sign" aria-hidden="true">▱</span>':''}${escape(n.name)}</span>${rh>64||branch?`<span class="s-tile-size">${format(r.value)}</span>`:''}`;tile.appendChild(button);el.appendChild(tile);if(branch)paint(r.children,rx+5,ry+32,rw-10,rh-37,depth+1,extra)})}paint(view.children||[view],0,0,el.clientWidth,el.clientHeight,1)}
  function selection(){const n=nodes.get(state.selected)||nodes.get(state.focus),v=visible(n),total=visible(nodes.get(state.focus))?.value||0;$('#s-selected-name').textContent=n.name;$('#s-selected-path').textContent=n.path;$('#s-selected-size').textContent=v?format(v.value):'等待扫描';$('#s-selected-share').textContent=total&&v?'占当前范围 '+(v.value/total*100).toFixed(1)+'%':'尚无结果';$('[data-action="enter"]').hidden=!n.children||n.id===state.focus;$('.s-selected-icon').innerHTML=`<i data-lucide="${n.children?'folder':'file'}" aria-hidden="true"></i>`;icons()}
  function render(){const n=nodes.get(state.focus),view=visible(n);$('#s-total').textContent=format(view?.value||0);let path=[];for(let p=n;p;p=p.parent)path.unshift(p);$('#s-crumbs').innerHTML=path.map((p,i)=>(i?'<span>›</span>':'')+`<button class="cursor-interaction" data-go="${p.id}" ${p.id===state.focus?'aria-current="location"':''}>${escape(p.name)}</button>`).join('');$('[data-action="back"]').disabled=state.historyIndex===0;$('[data-action="up"]').disabled=state.focus==='disk';$$('[data-detail]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.detail)===state.detail)));const cats=new Set();function collect(v){if(!v)return;if(v.node.category)cats.add(v.node.category);if(v.children)v.children.forEach(collect)}collect(view);$('#s-legend').innerHTML=[...cats].map(k=>`<span><i style="--color:${palette[k][3]}"></i>${palette[k][2]}</span>`).join('');$('#s-status').textContent=state.scanning?(state.paused?'演示扫描已暂停':'正在演示扫描')+' · '+state.progress+'%':state.progress<100?'扫描演示已停止 · 结果不完整':'示例已载入 · '+count(view)+' 个文件';$('#s-scan-progress').hidden=!state.scanning;$('#s-scan-progress span').style.width=state.progress+'%';$('[data-action="pause"]').hidden=!state.scanning;$('[data-action="stop"]').hidden=!state.scanning;$('[data-action="scan"]').disabled=state.scanning;$('[data-action="pause"]').textContent=state.paused?'继续':'暂停';selection();map();icons()}
  function go(id,record=true){const n=nodes.get(id);if(!n?.children)return;state.focus=id;state.selected=id;if(record){state.history=state.history.slice(0,state.historyIndex+1);state.history.push(id);state.historyIndex++}hideTooltip();render();save()}
  function select(id,expand=true){state.selected=id;if(expand&&nodes.get(id).children)state.expanded[id]=Math.min(3,(state.expanded[id]||0)+1);hideTooltip();map();selection();save()}
  function open(title,body){hideTooltip();$('#s-context').hidden=true;$('#s-dialog-title').textContent=title;$('#s-dialog-body').innerHTML=body;if(!$('#s-dialog').open)$('#s-dialog').showModal();icons()}
  function info(){const n=nodes.get(state.selected);open(n.name,`<dl><dt>完整路径</dt><dd>${escape(n.path)}</dd><dt>占用大小</dt><dd>${format(n.size)}</dd><dt>类型</dt><dd>${n.children?'目录':'文件'} · 示例数据</dd><dt>包含内容</dt><dd>${count(visible(n))} 个示例文件</dd></dl><p style="margin-top:20px;font-size:11px;color:#99a59d">这里仅展示模拟信息；没有读取本机文件。</p>`)}
  function choose(){open('选择浏览位置',['disk','home','downloads','movies','projects','library'].map(id=>{const n=nodes.get(id);return `<button class="s-place cursor-interaction" data-place="${id}"><span>${escape(n.name)}</span><small>${format(n.size)}　›</small></button>`}).join('')+'<p style="margin-top:15px;font-size:11px;color:#99a59d">这是示例位置选择器，不会请求磁盘访问权限。</p>')}
  function help(){open('这一版，先把空间看清楚',`<p><b>顶部看磁盘，主体看目录。</b><br>顶部始终显示整块磁盘：已用 412.6 GB、剩余 99.4 GB。下方「当前范围」只统计正在浏览的目录，进入子目录不会改变顶部数字。</p><p><b>只需要三种操作。</b><br>单击方块：选中，并在原位展开更多内容。<br>双击目录：进入该目录。<br>点击路径或上一级：回到上层。底部按钮也能进入目录。</p><p><b>想看清一个小方块？</b><br>悬停查看全名和大小，或选中后看底部信息。「概览 / 详细」控制图中层级，右键可打开操作菜单。</p><p><b>这一版做了什么减法？</b><br>移除了 AI 面板、建议、清理清单、四色标记、复杂筛选和多步骤引导，保留空间图、磁盘用量与基本目录导航。</p><p style="font-size:11px;color:#98a49c">所有文件、容量和扫描进度均为演示。默认展示 312.6 GB 的用户目录；其余 100 GB 为应用程序和系统等占用。点击路径中的 Macintosh HD 可查看全盘示例。本原型没有真实扫描、删除或 AI 功能，也不能用于衡量原生性能。</p>`)}
  function scan(){state.progress=0;state.scanning=true;state.paused=false;render();clearInterval(scanTimer);scanTimer=setInterval(()=>{if(state.paused)return;state.progress=Math.min(100,state.progress+5);if(state.progress===100){state.scanning=false;clearInterval(scanTimer)}render()},350)}
  function hideTooltip(){clearTimeout(hoverTimer);$('#s-tooltip').hidden=true}
  function tooltip(id,x,y){const n=nodes.get(id),t=$('#s-tooltip'),bounds=root.getBoundingClientRect();t.innerHTML=`${escape(n.name)} · ${format(n.size)}<small>${escape(n.path)}</small>`;t.hidden=false;const width=t.offsetWidth,height=t.offsetHeight;t.style.left=Math.max(8,Math.min(x-bounds.left+12,bounds.width-width-8))+'px';t.style.top=Math.max(8,Math.min(y-bounds.top+16,bounds.height-height-8))+'px'}
  const actions={help,choose,info,scan,close:()=>$('#s-dialog').close(),back:()=>{if(state.historyIndex>0)go(state.history[--state.historyIndex],false)},up:()=>{const p=nodes.get(state.focus).parent;if(p)go(p.id)},enter:()=>go(state.selected),pause:()=>{state.paused=!state.paused;render()},stop:()=>{clearInterval(scanTimer);state.scanning=false;render()},finder:()=>{const n=nodes.get(state.selected);open('在 Finder 中显示 · 演示',`<p>原生版本会在 Finder 中选中这个项目。</p><p><code>${escape(n.path)}</code></p><p style="font-size:11px;color:#99a59d">浏览器原型仅展示目标位置，不会打开真实文件。</p>`)}};
  root.addEventListener('click',e=>{const hit=e.target.closest('[data-select]');if(hit){clearTimeout(clickTimer);if(e.detail===0)select(hit.dataset.select);else clickTimer=setTimeout(()=>select(hit.dataset.select),230);return}hideTooltip();const act=e.target.closest('[data-action]');if(act){actions[act.dataset.action]?.();$('#s-context').hidden=true;return}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const place=e.target.closest('[data-place]');if(place){$('#s-dialog').close();go(place.dataset.place);return}const detail=e.target.closest('[data-detail]');if(detail){state.detail=Number(detail.dataset.detail);state.expanded={};render();save();return}$('#s-context').hidden=true});
  root.addEventListener('dblclick',e=>{const hit=e.target.closest('[data-select]');if(!hit)return;clearTimeout(clickTimer);const n=nodes.get(hit.dataset.select);if(n.children)go(n.id);else{select(n.id,false);info()}});
  root.addEventListener('contextmenu',e=>{const hit=e.target.closest('[data-select]');if(!hit)return;e.preventDefault();clearTimeout(clickTimer);select(hit.dataset.select,false);const n=nodes.get(state.selected),menu=$('#s-context'),box=root.getBoundingClientRect();menu.innerHTML=`${n.children?'<button class="cursor-interaction" data-action="enter">进入目录</button>':''}<button class="cursor-interaction" data-action="info">查看信息</button><button class="cursor-interaction" data-action="finder">在 Finder 中显示 · 演示</button>`;menu.style.left=Math.max(8,Math.min(e.clientX-box.left,box.width-208))+'px';menu.style.top=Math.max(8,Math.min(e.clientY-box.top,box.height-150))+'px';menu.hidden=false});
  root.addEventListener('pointerover',e=>{const hit=e.target.closest('[data-select]');if(hit&&!hit.contains(e.relatedTarget)){hideTooltip();hoverTimer=setTimeout(()=>tooltip(hit.dataset.select,e.clientX,e.clientY),500)}});
